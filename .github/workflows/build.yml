name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build EXE (PyInstaller)
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name AswaqBadrHR
          --icon assets/icon.ico
          --add-data "assets;assets"
          main.py

      - name: Download VC++ Redistributable
        shell: pwsh
        run: Invoke-WebRequest https://aka.ms/vs/17/release/vc_redist.x64.exe -OutFile installer/vc_redist.x64.exe

      - name: Portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path portable/AswaqBadrHR | Out-Null
          Copy-Item dist/AswaqBadrHR.exe portable/AswaqBadrHR/
          "portable" | Out-File portable/AswaqBadrHR/portable.txt
          Copy-Item installer/vc_redist.x64.exe portable/AswaqBadrHR/
          "لو ظهرت رسالة DLL load failed شغّل vc_redist.x64.exe مرة واحدة ثم أعد تشغيل البرنامج (ويندوز 10 أو أحدث 64 بت)" | Out-File portable/AswaqBadrHR/اقرأني.txt -Encoding utf8
          Compress-Archive -Path portable/AswaqBadrHR -DestinationPath AswaqBadrHR-Portable.zip

      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\setup.iss

      - uses: actions/upload-artifact@v4
        with:
          name: AswaqBadrHR-Setup
          path: dist_installer/AswaqBadrHR-Setup.exe

      - uses: actions/upload-artifact@v4
        with:
          name: AswaqBadrHR-Portable
          path: AswaqBadrHR-Portable.zip

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist_installer/AswaqBadrHR-Setup.exe
            AswaqBadrHR-Portable.zip
